name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rojo and Selene
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/install_tools.sh

      - name: Lint
        run: |
          bin/selene generate-roblox-std
          bin/selene src

      - name: Build place
        run: bin/rojo build -o place.rbxl

      - name: Check generated AssetIds is up to date
        run: |
          python3 scripts/upload_assets.py --codegen
          git diff --exit-code src/shared/AssetIds.luau
